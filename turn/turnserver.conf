# coturn config for the Soundbox WebRTC server.
#
# Why: cellular (CGNAT) clients lose their UDP mapping within ~30-60 s.
# Without TURN the ICE consent checks go unanswered and both sides drop the
# call (client: "STUN keepalive unanswered", server: "Consent to send expired").
#
# Deployment paths (pick one):
#   A) VPS (recommended) - public IP, no port forwarding:
#        sudo bash turn/setup_vps.sh
#   B) Local PC via Docker Desktop:
#        docker compose -f turn/docker-compose.yml up -d
#      Then forward on your router: UDP 3478, UDP 40000-40100 -> this PC.
#
# Keep user/password in sync with server/.env (this repo is public, so pick
# your own password before deploying — nothing here is a real credential):
#   TURN_URL=turn:<PUBLIC_IP>:3478
#   TURN_USERNAME=soundbox
#   TURN_CREDENTIAL=<same password as the user= line below>

listening-port=3478

# Set to your public IPv4 (required behind NAT; on a VPS with a directly
# bound public address this can stay commented). For docker-compose leave
# commented: DETECT_EXTERNAL_IP=yes auto-detects at startup.
# external-ip=203.0.113.10

fingerprint
lt-cred-mech
realm=soundbox.local
user=soundbox:CHANGE_ME

# Relay (TURN) media ports. Small range on purpose: easy router port-forward
# and Docker Desktop handles small published ranges reliably (large
# 49152-65535 ranges hang when publishing).
min-port=40000
max-port=40100

# Do not allow unauthenticated (no-credential) peers; WebRTC always uses
# long-term credentials here.
no-multicast-peers
no-tlsv1
no-tlsv1_1

verbose
